name: ecocollect_app
description: "EcoCollect - On-demand waste pickup & recycling platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Charts
  fl_chart: ^0.70.2
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  
  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # Animations
  lottie: ^3.3.1
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  
  # UI
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
